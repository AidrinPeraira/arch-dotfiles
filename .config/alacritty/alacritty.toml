[general]
import = [
    "~/.config/alacritty/themes/matugen.toml"
]
ipc_socket = true

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "None"
opacity = 0.85

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11.5

[cursor]
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 10000

[[keyboard.bindings]]
key = "Space"
mods = "Control"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "H"
mods = "Control|Shift"
command = { program = "sh", args = ["-c", "alacritty msg action select_all && alacritty msg action copy && alacritty msg action clear_selection && nvim +'set buftype=nofile' +'set noswapfile' + 'put +' +'1d'"] }

[hints]
alphabet = "jkhl"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "None" }
binding = { key = "U", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
