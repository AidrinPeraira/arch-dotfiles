# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

# Window Configuration
window_padding_width 0
background_opacity 0.95
background_blur 32
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size  no
initial_window_width  950
initial_window_height 500

# Cursor Configuration
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 5000
scrollback_pager nvim --noplugin -u NONE -c "set termguicolors" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - " -c "set buftype=nofile" -c "set noswapfile" -c "set cursorline" -c "set number" -c "set relativenumber"

# Terminal features
copy_on_select yes
strip_trailing_spaces smart
enable_audio_bell no
allow_remote_control yes
listen_on unix:/tmp/kitty

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+h show_scrollback

# Tab configuration
tab_bar_style fade
tab_fade 1
tab_bar_edge top
tab_bar_align left
active_tab_font_style bold
inactive_tab_font_style normal

# Shell integration
shell_integration enabled

# Dynamic color generation
include dank-theme.conf
